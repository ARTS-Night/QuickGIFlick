[package]
name = "quickgiflick"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A lightweight Windows GIF recorder powered by ScreenDelta."

[dependencies]
gif = "0.13.3"
screendelta = { git = "https://github.com/ARTS-Night/ScreenDelta.git", rev = "f31a18f" }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemInformation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1.23"
